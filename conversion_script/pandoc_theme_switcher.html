<script>
(() => {
  const MATH_FONT_MANIFEST_URL = "fonts_folder/math_fonts_manifest.json";

  const THEMES = [
    { value: "dawn", label: "Dawn Light" },
    { value: "pearl", label: "Pearl Light" },
    { value: "sage", label: "Sage Light" },
    { value: "lilac", label: "Lilac Light" },
    { value: "ivory", label: "Obsidian Dark" },
    { value: "slate", label: "Nocturne Dark" },
    { value: "forest", label: "Emerald Night Dark" },
    { value: "midnight", label: "Midnight Indigo Dark" },
    { value: "amoled", label: "AMOLED Darkest" },
  ];

  const TEXT_FONTS = [
    { value: "serif", label: "Serif" },
    { value: "sans", label: "Sans" },
    { value: "system", label: "System UI" },
    { value: "custom", label: "Custom" },
    { value: "palatino", label: "Palatino" },
    { value: "georgia", label: "Georgia" },
    { value: "times", label: "Times" },
    { value: "garamond", label: "Garamond" },
    { value: "mono", label: "Mono" },
  ];

  const TEXT_SIZES = [
    { value: "85", label: "85%" },
    { value: "95", label: "95%" },
    { value: "100", label: "100%" },
    { value: "110", label: "110%" },
    { value: "120", label: "120%" },
    { value: "130", label: "130%" },
  ];

  const MATH_SIZES = [
    { value: "80", label: "80%" },
    { value: "90", label: "90%" },
    { value: "100", label: "100%" },
    { value: "110", label: "110%" },
    { value: "120", label: "120%" },
    { value: "135", label: "135%" },
    { value: "150", label: "150%" },
  ];

  const THEME_STORAGE_KEY = "pandoc-book-theme";
  const TEXT_FONT_STORAGE_KEY = "pandoc-book-text-font";
  const MATH_FONT_STORAGE_KEY = "pandoc-book-math-font";
  const TEXT_SIZE_STORAGE_KEY = "pandoc-book-text-size";
  const MATH_SIZE_STORAGE_KEY = "pandoc-book-math-size";

  const canPersistChoice = (() => {
    try {
      return window.location.protocol !== "file:" && typeof window.localStorage !== "undefined";
    } catch (_error) {
      return false;
    }
  })();

  const validThemes = new Set(THEMES.map((theme) => theme.value));
  const validTextFonts = new Set(TEXT_FONTS.map((font) => font.value));
  const validTextSizes = new Set(TEXT_SIZES.map((size) => size.value));
  const validMathSizes = new Set(MATH_SIZES.map((size) => size.value));

  let activeMathFonts = [];
  let activeMathFontValues = new Set();
  const mathFontMap = new Map();

  function escapeCssString(value) {
    if (typeof value !== "string") {
      return "";
    }
    return value.replace(/\\/g, "\\\\").replace(/"/g, '\\"');
  }

  function normalizeMathFontEntry(entry) {
    if (!entry || typeof entry !== "object") {
      return null;
    }

    const value = typeof entry.value === "string" ? entry.value.trim() : "";
    const label = typeof entry.label === "string" ? entry.label.trim() : "";
    const file = typeof entry.file === "string" ? entry.file.trim() : "";
    const family = typeof entry.family === "string" ? entry.family.trim() : "";

    if (!value || !label || !file || !family) {
      return null;
    }

    return {
      value,
      label,
      file,
      family,
    };
  }

  function resolveFontFormat(filePath) {
    const file = filePath.toLowerCase();
    if (file.endsWith(".woff2")) {
      return "woff2";
    }
    if (file.endsWith(".woff")) {
      return "woff";
    }
    if (file.endsWith(".ttf")) {
      return "truetype";
    }
    return "opentype";
  }

  function applyMathFontFaceStyles() {
    const styleId = "repo-math-font-faces";
    let styleEl = document.getElementById(styleId);
    if (!styleEl) {
      styleEl = document.createElement("style");
      styleEl.id = styleId;
      document.head.appendChild(styleEl);
    }

    const css = activeMathFonts
      .map((font) => {
        const family = escapeCssString(font.family);
        const filePath = encodeURI(font.file);
        const format = resolveFontFormat(filePath);
        return `@font-face{font-family:"${family}";src:url("fonts_folder/${filePath}") format("${format}");font-style:normal;font-weight:400;font-display:swap;}`;
      })
      .join("\n");

    styleEl.textContent = css;
  }

  async function loadMathFontsFromManifest() {
    const embedded = window.__PANDOC_MATH_FONTS_MANIFEST__;
    if (embedded && Array.isArray(embedded.fonts)) {
      const normalizedEmbedded = embedded.fonts
        .map(normalizeMathFontEntry)
        .filter(Boolean);

      if (normalizedEmbedded.length > 0) {
        const uniqueEmbedded = [];
        const seenEmbedded = new Set();
        normalizedEmbedded.forEach((font) => {
          if (seenEmbedded.has(font.value)) {
            return;
          }
          seenEmbedded.add(font.value);
          uniqueEmbedded.push(font);
        });
        return uniqueEmbedded;
      }
    }

    const isHttp = window.location.protocol === "http:" || window.location.protocol === "https:";
    if (!isHttp) {
      return [];
    }

    try {
      const response = await fetch(MATH_FONT_MANIFEST_URL, { cache: "no-store" });
      if (!response.ok) {
        return [];
      }

      const payload = await response.json();
      if (!payload || !Array.isArray(payload.fonts)) {
        return [];
      }

      const normalized = payload.fonts
        .map(normalizeMathFontEntry)
        .filter(Boolean);

      const unique = [];
      const seenValues = new Set();
      normalized.forEach((font) => {
        if (seenValues.has(font.value)) {
          return;
        }
        seenValues.add(font.value);
        unique.push(font);
      });

      return unique;
    } catch (_error) {
      return [];
    }
  }

  function normalizeChoice(value, validSet) {
    if (!value) {
      return null;
    }
    return validSet.has(value) ? value : null;
  }

  function getStoredChoice(storageKey, validSet) {
    if (!canPersistChoice) {
      return null;
    }
    try {
      return normalizeChoice(window.localStorage.getItem(storageKey), validSet);
    } catch (_error) {
      return null;
    }
  }

  function setStoredChoice(storageKey, value) {
    if (!canPersistChoice) {
      return;
    }
    try {
      window.localStorage.setItem(storageKey, value);
    } catch (_error) {
      // Ignore storage errors in restricted environments
    }
  }

  function getStoredTheme() {
    return getStoredChoice(THEME_STORAGE_KEY, validThemes);
  }

  function getStoredTextFont() {
    return getStoredChoice(TEXT_FONT_STORAGE_KEY, validTextFonts);
  }

  function getStoredMathFont() {
    return getStoredChoice(MATH_FONT_STORAGE_KEY, activeMathFontValues);
  }

  function getStoredTextSize() {
    return getStoredChoice(TEXT_SIZE_STORAGE_KEY, validTextSizes);
  }

  function getStoredMathSize() {
    return getStoredChoice(MATH_SIZE_STORAGE_KEY, validMathSizes);
  }

  function setStoredTheme(theme) {
    setStoredChoice(THEME_STORAGE_KEY, theme);
  }

  function setStoredTextFont(font) {
    setStoredChoice(TEXT_FONT_STORAGE_KEY, font);
  }

  function setStoredMathFont(font) {
    setStoredChoice(MATH_FONT_STORAGE_KEY, font);
  }

  function setStoredTextSize(size) {
    setStoredChoice(TEXT_SIZE_STORAGE_KEY, size);
  }

  function setStoredMathSize(size) {
    setStoredChoice(MATH_SIZE_STORAGE_KEY, size);
  }

  function getPreferredTheme() {
    const fromStorage = getStoredTheme();
    if (fromStorage) {
      return fromStorage;
    }
    const darkQuery = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)");
    if (darkQuery && darkQuery.matches) {
      return "midnight";
    }
    return "dawn";
  }

  function getPreferredTextFont() {
    return getStoredTextFont() || "serif";
  }

  function getPreferredMathFont() {
    const fromStorage = getStoredMathFont();
    if (fromStorage) {
      return fromStorage;
    }
    return activeMathFonts[0]?.value || null;
  }

  async function refreshActiveMathFonts() {
    activeMathFonts = await loadMathFontsFromManifest();
    activeMathFontValues = new Set(activeMathFonts.map((font) => font.value));
    mathFontMap.clear();
    activeMathFonts.forEach((font) => {
      mathFontMap.set(font.value, font);
    });
    applyMathFontFaceStyles();
  }

  function getPreferredTextSize() {
    return getStoredTextSize() || "100";
  }

  function getPreferredMathSize() {
    return getStoredMathSize() || "100";
  }

  function applyTheme(theme) {
    const chosen = normalizeChoice(theme, validThemes) || "dawn";
    document.documentElement.setAttribute("data-theme", chosen);
    setStoredTheme(chosen);
    return chosen;
  }

  function applyTextFont(font) {
    const chosen = normalizeChoice(font, validTextFonts) || "serif";
    document.documentElement.setAttribute("data-font", chosen);
    setStoredTextFont(chosen);
    return chosen;
  }

  function applyMathFont(font) {
    const chosen = normalizeChoice(font, activeMathFontValues)
      || normalizeChoice(getPreferredMathFont(), activeMathFontValues)
      || activeMathFonts[0]?.value
      || null;
    if (!chosen) {
      document.documentElement.removeAttribute("data-math-font");
      document.documentElement.style.removeProperty("--font-math");
      return null;
    }
    const selected = mathFontMap.get(chosen);
    if (!selected) {
      return null;
    }

    document.documentElement.setAttribute("data-math-font", chosen);
    document.documentElement.style.setProperty("--font-math", `"${selected.family}", serif`);
    setStoredMathFont(chosen);
    return chosen;
  }

  function applyTextSize(size) {
    const chosen = normalizeChoice(size, validTextSizes) || "100";
    document.documentElement.setAttribute("data-font-size", chosen);
    setStoredTextSize(chosen);
    return chosen;
  }

  function applyMathSize(size) {
    const chosen = normalizeChoice(size, validMathSizes) || "100";
    document.documentElement.setAttribute("data-math-size", chosen);
    setStoredMathSize(chosen);
    return chosen;
  }

  function markTocLayout() {
    if (document.getElementById("TOC")) {
      document.body.classList.add("pandoc-has-toc");
    }
  }

  function setupMobileTocDrawer() {
    const toc = document.getElementById("TOC");
    if (!toc || document.querySelector(".toc-mobile-toggle")) {
      return;
    }

    const toggle = document.createElement("button");
    toggle.type = "button";
    toggle.className = "toc-mobile-toggle";
    toggle.setAttribute("aria-controls", "TOC");
    toggle.setAttribute("aria-expanded", "false");
    toggle.textContent = "☰ Contents";

    const navbar = document.createElement("nav");
    navbar.className = "mobile-navbar";
    navbar.setAttribute("aria-label", "Mobile navigation");

    const navbarTitle = document.createElement("div");
    navbarTitle.className = "mobile-navbar-title";
    navbarTitle.textContent = "Notes";

    const navbarActions = document.createElement("div");
    navbarActions.className = "mobile-navbar-actions";
    navbarActions.append(toggle);

    navbar.append(navbarTitle, navbarActions);

    const backdrop = document.createElement("button");
    backdrop.type = "button";
    backdrop.className = "toc-mobile-backdrop";
    backdrop.setAttribute("aria-label", "Close contents panel");

    function isOpen() {
      return document.body.classList.contains("toc-mobile-open");
    }

    function setOpen(open) {
      document.body.classList.toggle("toc-mobile-open", open);
      toggle.setAttribute("aria-expanded", open ? "true" : "false");
    }

    toggle.addEventListener("click", () => {
      setOpen(!isOpen());
    });

    backdrop.addEventListener("click", () => {
      setOpen(false);
    });

    toc.querySelectorAll("a").forEach((link) => {
      link.addEventListener("click", () => {
        setOpen(false);
      });
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        setOpen(false);
      }
    });

    document.body.append(navbar, backdrop);
  }

  function resolveSwitcherHost() {
    const toc = document.getElementById("TOC");
    if (toc) {
      return { node: toc, mode: "toc" };
    }

    const title = document.getElementById("title-block-header");
    if (title) {
      return { node: title, mode: "header" };
    }

    return { node: document.body, mode: "header" };
  }

  function createControl({ id, labelText, options, selectedValue, onChange }) {
    const control = document.createElement("div");
    control.className = "theme-switcher-control";

    const label = document.createElement("label");
    label.setAttribute("for", id);
    label.textContent = labelText;

    const select = document.createElement("select");
    select.id = id;
    select.name = id;

    options.forEach((optionData) => {
      const option = document.createElement("option");
      option.value = optionData.value;
      option.textContent = optionData.label;
      select.appendChild(option);
    });

    select.value = selectedValue;

    function applySelection() {
      const value = select.value;
      if (!value) {
        return;
      }
      onChange(value);
    }

    select.addEventListener("input", applySelection);
    select.addEventListener("change", applySelection);

    control.append(label, select);
    return control;
  }

  function createSwitcher(currentTheme, currentTextFont, currentMathFont, currentTextSize, currentMathSize) {
    if (document.querySelector(".theme-switcher")) {
      return;
    }

    const wrapper = document.createElement("div");
    wrapper.className = "theme-switcher";
    wrapper.setAttribute("role", "group");
    wrapper.setAttribute("aria-label", "Display controls");

    const toggle = document.createElement("button");
    toggle.type = "button";
    toggle.className = "theme-switcher-toggle";
    toggle.setAttribute("aria-expanded", "false");
    toggle.textContent = "Display Controls ▾";

    const panel = document.createElement("div");
    panel.className = "theme-switcher-panel";
    panel.id = "theme-switcher-panel";
    toggle.setAttribute("aria-controls", panel.id);

    const controls = document.createElement("div");
    controls.className = "theme-switcher-controls";

    const controlsToAppend = [
      createControl({
        id: "theme-switcher-select",
        labelText: "Theme",
        options: THEMES,
        selectedValue: currentTheme,
        onChange: (value) => applyTheme(value),
      }),
      createControl({
        id: "text-font-switcher-select",
        labelText: "Text Font",
        options: TEXT_FONTS,
        selectedValue: currentTextFont,
        onChange: (value) => applyTextFont(value),
      }),
      createControl({
        id: "text-size-switcher-select",
        labelText: "Text Size",
        options: TEXT_SIZES,
        selectedValue: currentTextSize,
        onChange: (value) => applyTextSize(value),
      }),
      createControl({
        id: "math-size-switcher-select",
        labelText: "Math Size",
        options: MATH_SIZES,
        selectedValue: currentMathSize,
        onChange: (value) => applyMathSize(value),
      })
    ];

    if (activeMathFonts.length > 0) {
      controlsToAppend.splice(
        2,
        0,
        createControl({
          id: "math-font-switcher-select",
          labelText: "Math Font",
          options: activeMathFonts,
          selectedValue: currentMathFont || activeMathFonts[0].value,
          onChange: (value) => applyMathFont(value),
        })
      );
    }

    controls.append(...controlsToAppend);

    panel.append(controls);
    wrapper.append(toggle, panel);

    function setOpen(open) {
      wrapper.classList.toggle("is-open", open);
      toggle.setAttribute("aria-expanded", open ? "true" : "false");
      toggle.textContent = open ? "Display Controls ▴" : "Display Controls ▾";
    }

    toggle.addEventListener("click", () => {
      const open = wrapper.classList.contains("is-open");
      setOpen(!open);
    });

    document.addEventListener("click", (event) => {
      if (!wrapper.contains(event.target)) {
        setOpen(false);
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        setOpen(false);
      }
    });

    const host = resolveSwitcherHost();
    if (host.mode === "toc") {
      wrapper.classList.add("theme-switcher--toc");
      host.node.prepend(wrapper);
      return;
    }

    wrapper.classList.add("theme-switcher--header");
    if (host.node === document.body) {
      host.node.prepend(wrapper);
      return;
    }
    host.node.appendChild(wrapper);
  }

  async function init() {
    if (!document.body) {
      return;
    }
    markTocLayout();
    setupMobileTocDrawer();
    await refreshActiveMathFonts();
    const currentTheme = applyTheme(getPreferredTheme());
    const currentTextFont = applyTextFont(getPreferredTextFont());
    const currentMathFont = applyMathFont(getPreferredMathFont());
    const currentTextSize = applyTextSize(getPreferredTextSize());
    const currentMathSize = applyMathSize(getPreferredMathSize());
    createSwitcher(currentTheme, currentTextFont, currentMathFont, currentTextSize, currentMathSize);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init, { once: true });
  } else {
    init();
  }
})();
</script>
